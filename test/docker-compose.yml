# Local test harness: Heroku-like source, Render-like target (with and
# without the session_replication_role grant), and the migration image.
#
#   test/e2e.sh    builds the image (pg-migrate:test), then starts this
#
# Versions: SOURCE_PG_MAJOR is Heroku's major, TARGET_PG_MAJOR is Render's.
# The image is built with the Dockerfile's defaults, as in production: client
# tools for every supported major, from which the scripts pick pg_dump.
# PG_IMAGE lets you pull through a mirror, e.g.
# PG_IMAGE=mirror.gcr.io/library/postgres.
name: pg-migrate-test

x-tls: &tls
  - postgres
  - -c
  - ssl=on
  - -c
  - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
  - -c
  - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

services:
  source:
    image: ${PG_IMAGE:-postgres}:${SOURCE_PG_MAJOR:-16}
    command: *tls
    environment:
      POSTGRES_PASSWORD: admin-secret
      POSTGRES_DB: app
    volumes:
      - ./source:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      retries: 30

  target:
    image: ${PG_IMAGE:-postgres}:${TARGET_PG_MAJOR:-17}
    command: *tls
    environment:
      POSTGRES_PASSWORD: admin-secret
      POSTGRES_DB: postgres
      # test/e2e.sh sets "no" for E2E_SUPERUSER=yes.
      GRANT_REPLICA_ROLE: ${TARGET_GRANT_REPLICA_ROLE:-yes}
    volumes:
      - ./target:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      retries: 30

  # Same as target, but the migration role can't set session_replication_role
  # (no grant, not a superuser). Preflight must block it.
  target-nogrant:
    image: ${PG_IMAGE:-postgres}:${TARGET_PG_MAJOR:-17}
    command: *tls
    environment:
      POSTGRES_PASSWORD: admin-secret
      POSTGRES_DB: postgres
      GRANT_REPLICA_ROLE: "no"
    volumes:
      - ./target:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      retries: 30

  migrator:
    build:
      context: ..
      dockerfile: image/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-}
        GIT_SHA: ${GIT_SHA:-test}
      # apt in the Dockerfile fetches over HTTPS with this CA bundle (the base
      # image has none), as builder/build_image.sh supplies it in a sandbox.
      secrets: [ca]
    image: pg-migrate:test
    # The user Render sandboxes run exec as (see docs/spike.md). The scripts
    # handle both root (they drop to postgres) and postgres.
    user: ${MIGRATOR_USER:-root}
    # Like a sandbox: no reliance on ENTRYPOINT/CMD, just keep it alive.
    entrypoint: ["sleep", "infinity"]
    env_file: migration.test.env
    environment:
      # The Render superuser password and its SCRAM verifier, as the app
      # gives every sandbox; test/e2e.sh sets them.
      RENDER_SUPERUSER_PASSWORD: ${RENDER_SUPERUSER_PASSWORD:-}
      RENDER_SUPERUSER_VERIFIER: ${RENDER_SUPERUSER_VERIFIER:-}
    depends_on:
      source: { condition: service_healthy }
      target: { condition: service_healthy }
      target-nogrant: { condition: service_healthy }

secrets:
  ca:
    file: ${CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
