# pg-migrate on Render: the web app plus a small Postgres for its own state.
#
# Access: the service has Render's authentication enabled, which signs users
# in and forwards their access token in X-Forwarded-Access-Token. The app
# verifies that token on every request (signature against the issuer's keys,
# expiry, issuer), so a request without a valid token is refused even if it
# reaches the service some other way. Any OIDC provider works: set AUTH_ISSUER,
# and optionally AUTH_VERIFY (jwt or userinfo), AUTH_JWKS_URL, AUTH_AUDIENCE, AUTH_USER_CLAIM,
# AUTH_ALLOWED_USERS (see app/pgmigrate/auth.py). Without AUTH_ISSUER the app
# refuses to start.
#
# Render asks for the `sync: false` variables when it creates the Blueprint;
# change them later in the Dashboard (Environment):
#   AUTH_ISSUER           issuer of the forwarded access tokens, e.g. https://<org>.okta.com
#   RENDER_API_KEY        API key of a workspace admin (credential brokering needs admin)
#   RENDER_WORKSPACE_ID   the workspace the sandboxes belong to (tea-...)
#   GITHUB_REGISTRY       e.g. ghcr.io/<org or user>
#   GITHUB_USERNAME       the GitHub user the token belongs to
#   GITHUB_TOKEN          classic PAT with write:packages (and read:packages)
#
# APP_SECRET_KEY encrypts the stored connection strings. Don't change it once
# migrations exist, or their connection strings can't be read anymore.
databases:
  - name: migration-state-db
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    # Internal connections only: the app is the only client.
    ipAllowList: []

services:
  - type: web
    name: pg-migrate
    runtime: python
    plan: 0.5c-512mb
    authentication:
      enabled: true
    buildCommand: pip install -r app/requirements.txt
    startCommand: >-
      uvicorn --factory pgmigrate.web:app_from_env --app-dir app
      --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    # Jobs checkpoint their progress, so a deploy resumes them, but give
    # in-flight API calls time to finish.
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DATABASE_URL
        fromDatabase:
          name: migration-state-db
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true
      # Identity provider that issues the forwarded access tokens.
      - key: AUTH_ISSUER
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKSPACE_ID
        sync: false
      - key: GITHUB_REGISTRY
        sync: false
      - key: GITHUB_USERNAME
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # Postgres major of the migration image: Render's target version, >= Heroku's.
      - key: PG_MAJOR
        value: "17"
      # Outbound network policy of the image-build sandbox: allow-all, deny-all,
      # or a comma list of hosts (an allow-list; *.example.com covers
      # subdomains). This is every host the build contacts: BuildKit's GitHub
      # release and its download host, the base image registry, Debian and PGDG
      # apt, and the registry it pushes to. Add hosts here if you change
      # BASE_IMAGE or GITHUB_REGISTRY. Migration sandboxes don't use a setting:
      # each gets an allow-list of its own migration's database hosts.
      - key: BUILD_NETWORK_POLICY
        value: github.com,release-assets.githubusercontent.com,mirror.gcr.io,deb.debian.org,apt.postgresql.org,ghcr.io
