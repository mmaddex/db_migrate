name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x -s bash -S warning sandbox/*.sh builder/*.sh test/*.sh test/target/*.sh
      - name: shell unit tests
        run: test/unit_lib.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: web app unit tests
        working-directory: app
        env:
          TEST_DATABASE_URL: postgresql://postgres:pw@127.0.0.1:5432/postgres
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q

  sandbox-scripts-e2e:
    runs-on: ubuntu-24.04
    needs: lint-and-unit
    strategy:
      fail-fast: false
      matrix:
        # Heroku major / Render major / user the sandbox exec runs as /
        # whether the steps log in as a separate superuser that cutover hands
        # everything back from (E2E_SUPERUSER). One image serves every pair;
        # schema.sh dumps with the target's pg_dump, so the targets cover each
        # client major in the image (14-18).
        include:
          - { source: '14', target: '14', user: postgres, superuser: 'yes' }
          - { source: '14', target: '15', user: root, superuser: 'no' }
          - { source: '15', target: '16', user: root, superuser: 'yes' }
          - { source: '16', target: '17', user: root, superuser: 'no' }
          - { source: '14', target: '17', user: postgres, superuser: 'yes' }
          - { source: '17', target: '18', user: root, superuser: 'no' }
          - { source: '18', target: '18', user: postgres, superuser: 'yes' }
    steps:
      - uses: actions/checkout@v4
      - name: test/e2e.sh
        env:
          SOURCE_PG_MAJOR: ${{ matrix.source }}
          TARGET_PG_MAJOR: ${{ matrix.target }}
          MIGRATOR_USER: ${{ matrix.user }}
          E2E_SUPERUSER: ${{ matrix.superuser }}
          GIT_SHA: ${{ github.sha }}
          BASE_IMAGE: mirror.gcr.io/library/debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
        run: test/e2e.sh

  image-build-in-sandbox:
    runs-on: ubuntu-24.04
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - name: builder/build_image.sh in a plain Debian container
        env:
          BASE_IMAGE: mirror.gcr.io/library/debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
        run: test/build_image_test.sh

  web-app-e2e:
    runs-on: ubuntu-24.04
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: web app drives the whole flow in Docker
        working-directory: app
        env:
          PGM_E2E: '1'
          PGM_SHOTS: ${{ runner.temp }}/screenshots
          BASE_IMAGE: mirror.gcr.io/library/debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
        run: |
          pip install -q -r requirements-dev.txt
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.48.2
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" python -m pytest -q tests/test_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-app-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
